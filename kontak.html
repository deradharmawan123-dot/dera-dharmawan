<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">Dera<span>.Dev</span></a>
      <nav class="nav-links">
        <a href="index.html" data-i18n="nav-home" class="nav-item">Home</a>
        <a href="tentang.html" data-i18n="nav-about" class="nav-item">About</a>
        <a href="keahlian.html" data-i18n="nav-skills" class="nav-item">Skills</a>
        <a href="proyek.html" data-i18n="nav-projects" class="nav-item">Projects</a>
        <a href="pengalaman.html" data-i18n="nav-experience" class="nav-item">Experience</a>
        <a href="kontak.html" data-i18n="nav-contact" class="nav-item">Contact</a>
      </nav>
      <div class="nav-actions">
        <button id="lang-toggle" class="btn-lang">EN</button>
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section-page">
      <h2 class="section-title" data-i18n="contact-title">Get In Touch</h2>
      
      <div class="contact-box glass">
        <form action="https://api.web3forms.com/submit" method="POST" id="contact-form">
          <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
          
          <div class="form-group">
            <label for="name" data-i18n="contact-name-label">Your Name</label>
            <input type="text" name="name" id="name" required placeholder="John Doe">
          </div>
          
          <div class="form-group">
            <label for="email" data-i18n="contact-email-label">Your Email</label>
            <input type="email" name="email" id="email" required placeholder="john@example.com">
          </div>
          
          <div class="form-group">
            <label for="message" data-i18n="contact-msg-label">Your Message</label>
            <textarea name="message" id="message" rows="5" required placeholder="Let's build magic..."></textarea>
          </div>
          
          <button type="submit" class="btn btn-primary" style="width: 100%;" data-i18n="contact-btn">Send Message</button>
        </form>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
